version: "3.9"
services:
  db:
    image: mariadb:10
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root

    volumes:
      - app_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uapp -p$${MARIADB_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnet

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_PROFILES_ACTIVE: docker
      # 外部 API 共用 JWT 憑證
      ERP_TOKEN_URL: "https://your-erp.example.com/api/auth/login"
      ERP_ACCOUNT: "your_account"
      ERP_SALASANA: "your_salasana"
      # ERP 商品主檔同步
      ERP_PRODUCT_ENABLED: "false"
      ERP_PRODUCT_LIST_URL: "https://your-erp.example.com/api/product-list"
      # ERP 廠商主檔同步
      ERP_VENDOR_ENABLED: "false"
      ERP_VENDOR_LIST_URL: "https://your-erp.example.com/api/vendor-list"
      # ERP 採購單
      ERP_PURCHASE_ORDER_ENABLED: "false"
      ERP_PURCHASE_ORDER_URL: "https://your-erp.example.com/api/purchase-order"
      # PDCA 重算
      PDCA_RECOMPUTE_ENABLED: "false"
      PDCA_RECOMPUTE_URL: "https://your-pdca.example.com/api/recompute"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - appnet


  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  app_db_data:
